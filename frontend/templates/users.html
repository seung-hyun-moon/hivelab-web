{% extends "base.html" %}

{% block content %}
<div class="mx-auto px-4 py-6 mt-10">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
        <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between mb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">사용자 관리</h1>
                <p class="text-gray-600 mt-1">시스템 사용자를 관리하고 권한을 설정하세요</p>
            </div>
            <button id="createUserBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg flex items-center gap-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                새 사용자 생성
            </button>
        </div>

        <div class="flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="이름 또는 이메일로 검색..."
                           class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <select id="positionFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">모든 직위</option>
                <option value="대표">대표</option>
                <option value="이사">이사</option>
                <option value="팀장">팀장</option>
                <option value="차장">차장</option>
                <option value="과장">과장</option>
                <option value="사원">사원</option>
                <option value="엔지니어">엔지니어</option>
            </select>
            <select id="permissionFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">모든 권한</option>
                <option value="ADMIN">관리자</option>
                <option value="MANAGER">중간관리자</option>
                <option value="STAFF">사원</option>
            </select>
            <select id="statusFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">모든 상태</option>
                <option value="active">활성</option>
                <option value="inactive">잠김</option>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="usersGrid">
        </div>

    <div id="emptyState" class="hidden bg-white rounded-lg shadow-sm border border-gray-200 p-12 text-center">
        <svg class="mx-auto w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        <h3 class="text-lg font-medium text-gray-900 mb-2">사용자가 없습니다</h3>
        <p class="text-gray-500">검색 조건에 맞는 사용자를 찾을 수 없습니다.</p>
    </div>

    <div id="loadingState" class="bg-white rounded-lg shadow-sm border border-gray-200 p-12 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="text-gray-500 mt-4">사용자 정보를 불러오는 중...</p>
    </div>
</div>

<div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900" id="modalTitle">새 사용자 생성</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form id="userForm" class="p-6 space-y-4">
                <input type="hidden" id="userId">

                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">이름 *</label>
                    <input type="text" id="name" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">이메일 (카카오 ID) *</label>
                    <input type="email" id="email" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="position" class="block text-sm font-medium text-gray-700 mb-1">직위</label>
                    <select id="position"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="엔지니어">엔지니어</option>
                        <option value="사원">사원</option>
                        <option value="과장">과장</option>
                        <option value="팀장">팀장</option>
                        <option value="차장">차장</option>
                        <option value="이사">이사</option>
                        <option value="대표">대표</option>
                    </select>
                </div>

                <div>
                    <label for="permission_level" class="block text-sm font-medium text-gray-700 mb-1">권한 등급</label>
                    <select id="permission_level"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="STAFF">사원</option>
                        <option value="MANAGER">중간관리자</option>
                        <option value="ADMIN">관리자</option>
                    </select>
                </div>

                <div>
                    <label for="profile_picture_url" class="block text-sm font-medium text-gray-700 mb-1">프로필 사진 URL</label>
                    <input type="url" id="profile_picture_url" placeholder="https://example.com/image.jpg"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="is_active" checked
                           class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                    <label for="is_active" class="ml-2 text-sm text-gray-700">계정 활성화</label>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="is_locked"
                           class="w-4 h-4 text-red-600 bg-gray-100 border-gray-300 rounded focus:ring-red-500">
                    <label for="is_locked" class="ml-2 text-sm text-gray-700">계정 잠금</label>
                </div>
            </form>

            <div class="flex justify-end gap-3 p-6 border-t border-gray-200">
                <button id="cancelBtn" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">취소</button>
                <button id="saveUserBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">저장</button>
            </div>
        </div>
    </div>
</div>

<div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full">
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="bg-red-100 rounded-full p-3 mr-4">
                        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900">사용자 삭제</h3>
                        <p class="text-gray-600 mt-1" id="deleteMessage">정말로 이 사용자를 삭제하시겠습니까?</p>
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button id="cancelDeleteBtn" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">취소</button>
                    <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">삭제</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let allUsers = [];
let currentDeleteUserId = null;

// DOM Elements
const usersGrid = document.getElementById('usersGrid');
const emptyState = document.getElementById('emptyState');
const loadingState = document.getElementById('loadingState');
const userModal = document.getElementById('userModal');
const deleteModal = document.getElementById('deleteModal');

// Modal controls
const createUserBtn = document.getElementById('createUserBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const cancelBtn = document.getElementById('cancelBtn');
const saveUserBtn = document.getElementById('saveUserBtn');
const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

// Filter controls
const searchInput = document.getElementById('searchInput');
const permissionFilter = document.getElementById('permissionFilter');
const statusFilter = document.getElementById('statusFilter');
const positionFilter = document.getElementById('positionFilter');

// Utility functions
function getPermissionBadge(level) {
    const badges = {
        'ADMIN': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">관리자</span>',
        'MANAGER': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">중간관리자</span>',
        'STAFF': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">사원</span>'
    };
    return badges[level] || badges['STAFF'];
}

function getPositionBadge(position) {
    let badgeClass = 'bg-gray-100 text-gray-800';
    if (position === '대표') badgeClass = 'bg-blue-600 text-white';
    else if (position === '이사') badgeClass = 'bg-indigo-100 text-indigo-800';
    else if (position === '팀장') badgeClass = 'bg-teal-100 text-teal-800';
    else if (position === '차장') badgeClass = 'bg-purple-100 text-purple-800';
    else if (position === '과장') badgeClass = 'bg-pink-100 text-pink-800';
    else if (position === '사원') badgeClass = 'bg-green-100 text-green-800';
    else if (position === '엔지니어') badgeClass = 'bg-yellow-100 text-yellow-800';

    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${badgeClass}">${position}</span>`;
}


function getStatusBadge(isActive, isLocked, userId) {
    if (isLocked) {
        return `<button onclick="toggleLock(${userId})" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 hover:bg-red-200 transition-colors cursor-pointer" title="클릭하여 잠금 해제">잠김</button>`;
    }

    if (isActive) {
        return `<button onclick="toggleActive(${userId})" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 hover:bg-green-200 transition-colors cursor-pointer" title="클릭하여 비활성화">활성</button>`;
    } else {
        return `<button onclick="toggleActive(${userId})" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 hover:bg-gray-200 transition-colors cursor-pointer" title="클릭하여 활성화">비활성</button>`;
    }
}

function createUserCard(user) {
    const isLocked = user.is_locked || false;

    return `
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow ${isLocked ? 'opacity-75' : ''}">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
                        ${user.profile_picture_url
                            ? `<img src="${user.profile_picture_url}" alt="${user.name}" class="w-10 h-10 rounded-full object-cover">`
                            : `<span class="text-gray-600 font-medium">${user.name.charAt(0).toUpperCase()}</span>`
                        }
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-semibold text-gray-900">${user.name}</h3>
                        <p class="text-xs text-gray-500">${user.email}</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="editUser(${user.id})" class="p-1.5 text-gray-400 hover:text-blue-600 transition-colors" title="수정">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </button>
                    <button onclick="deleteUser(${user.id}, '${user.name}')" class="p-1.5 text-gray-400 hover:text-red-600 transition-colors" title="삭제">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">직위</span>
                    ${getPositionBadge(user.position)}
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">권한</span>
                    ${getPermissionBadge(user.permission_level)}
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">활성 상태</span>
                    ${getStatusBadge(user.is_active, isLocked, user.id)}
                </div>
                ${isLocked ? `
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">잠금 상태</span>
                    <button onclick="toggleLock(${user.id})" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 hover:bg-red-200 transition-colors cursor-pointer" title="클릭하여 잠금 해제">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        잠금됨
                    </button>
                </div>
                ` : ''}
            </div>
        </div>
    `;
}

function renderUsers(users) {
    if (users.length === 0) {
        usersGrid.innerHTML = '';
        usersGrid.classList.add('hidden');
        emptyState.classList.remove('hidden');
    } else {
        usersGrid.innerHTML = users.map(createUserCard).join('');
        usersGrid.classList.remove('hidden');
        emptyState.classList.add('hidden');
    }
    loadingState.classList.add('hidden');
}

function filterUsers() {
    const searchTerm = searchInput.value.toLowerCase();
    const permissionLevel = permissionFilter.value;
    const position = positionFilter.value;
    const status = statusFilter.value;

    const filtered = allUsers.filter(user => {
        const matchesSearch = user.name.toLowerCase().includes(searchTerm) ||
                            user.email.toLowerCase().includes(searchTerm);
        const matchesPermission = !permissionLevel || user.permission_level === permissionLevel;
        const matchesPosition = !position || user.position === position;


        let matchesStatus = true;
        if (status) {
            const isLocked = user.is_locked || false;
            if (status === 'active') {
                matchesStatus = user.is_active && !isLocked;
            } else if (status === 'inactive') {
                matchesStatus = !user.is_active || isLocked;
            }
        }

        return matchesSearch && matchesPermission && matchesPosition && matchesStatus;
    });

    renderUsers(filtered);
}

async function loadUsers() {
    try {
        loadingState.classList.remove('hidden');
        usersGrid.classList.add('hidden');
        emptyState.classList.add('hidden');

        const response = await fetch('/api/users/');
        if (!response.ok) throw new Error('Failed to fetch users');

        allUsers = await response.json();
        filterUsers();
    } catch (error) {
        console.error('Error loading users:', error);
        loadingState.innerHTML = '<div class="text-red-600">사용자 데이터를 불러오는데 실패했습니다.</div>';
    }
}

// Toggle functions (생략하지 않고 그대로 유지)
async function toggleActive(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;

    try {
        const response = await fetch(`/api/users/${userId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                is_active: !user.is_active
            })
        });

        if (!response.ok) throw new Error('상태 변경에 실패했습니다.');

        // Update local data
        user.is_active = !user.is_active;
        filterUsers(); // Re-render
    } catch (error) {
        alert('상태 변경 중 오류가 발생했습니다: ' + error.message);
    }
}

async function toggleLock(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;

    try {
        const response = await fetch(`/api/users/${userId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                is_locked: !user.is_locked
            })
        });

        if (!response.ok) throw new Error('잠금 상태 변경에 실패했습니다.');

        // Update local data
        user.is_locked = !user.is_locked;
        filterUsers(); // Re-render
    } catch (error) {
        alert('잠금 상태 변경 중 오류가 발생했습니다: ' + error.message);
    }
}

function showModal(title = '새 사용자 생성') {
    document.getElementById('modalTitle').textContent = title;
    userModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function hideModal() {
    userModal.classList.add('hidden');
    document.body.style.overflow = '';
    resetForm();
}

function resetForm() {
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
    document.getElementById('is_active').checked = true;
    document.getElementById('is_locked').checked = false;
    document.getElementById('position').value = '사원';
}

function editUser(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;

    document.getElementById('userId').value = user.id;
    document.getElementById('name').value = user.name;
    document.getElementById('email').value = user.email;
    document.getElementById('position').value = user.position || '사원';
    document.getElementById('permission_level').value = user.permission_level;
    document.getElementById('profile_picture_url').value = user.profile_picture_url || '';
    document.getElementById('is_active').checked = user.is_active;
    document.getElementById('is_locked').checked = user.is_locked || false;

    showModal('사용자 정보 수정');
}

function deleteUser(userId, userName) {
    currentDeleteUserId = userId;
    document.getElementById('deleteMessage').textContent = `'${userName}' 사용자를 정말로 삭제하시겠습니까?`;
    deleteModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function hideDeleteModal() {
    deleteModal.classList.add('hidden');
    document.body.style.overflow = '';
    currentDeleteUserId = null;
}

async function saveUser() {
    const form = document.getElementById('userForm');
    const formData = new FormData(form);

    const userId = document.getElementById('userId').value;
    const method = userId ? 'PUT' : 'POST';
    const url = userId ? `/api/users/${userId}` : '/api/users/';

    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        position: document.getElementById('position').value,
        permission_level: document.getElementById('permission_level').value,
        profile_picture_url: document.getElementById('profile_picture_url').value || null,
        is_active: document.getElementById('is_active').checked,
        is_locked: document.getElementById('is_locked').checked
    };

    if (!data.name || !data.email) {
        alert('이름과 이메일은 필수 항목입니다.');
        return;
    }

    try {
        saveUserBtn.disabled = true;
        saveUserBtn.textContent = '저장 중...';

        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || '저장에 실패했습니다.');
        }

        hideModal();
        loadUsers();
    } catch (error) {
        alert('사용자 저장 중 오류 발생: ' + error.message);
    } finally {
        saveUserBtn.disabled = false;
        saveUserBtn.textContent = '저장';
    }
}

async function confirmDelete() {
    if (!currentDeleteUserId) return;

    try {
        confirmDeleteBtn.disabled = true;
        confirmDeleteBtn.textContent = '삭제 중...';

        const response = await fetch(`/api/users/${currentDeleteUserId}`, {
            method: 'DELETE'
        });

        if (!response.ok) throw new Error('삭제에 실패했습니다.');

        hideDeleteModal();
        loadUsers();
    } catch (error) {
        alert('사용자 삭제 중 오류가 발생했습니다: ' + error.message);
    } finally {
        confirmDeleteBtn.disabled = false;
        confirmDeleteBtn.textContent = '삭제';
    }
}

// Event listeners
createUserBtn.addEventListener('click', () => showModal());
closeModalBtn.addEventListener('click', hideModal);
cancelBtn.addEventListener('click', hideModal);
saveUserBtn.addEventListener('click', saveUser);
cancelDeleteBtn.addEventListener('click', hideDeleteModal);
confirmDeleteBtn.addEventListener('click', confirmDelete);

// Filter event listeners
searchInput.addEventListener('input', filterUsers);
permissionFilter.addEventListener('change', filterUsers);
statusFilter.addEventListener('change', filterUsers);
positionFilter.addEventListener('change', filterUsers);

// Close modals on outside click
userModal.addEventListener('click', (e) => {
    if (e.target === userModal) hideModal();
});

deleteModal.addEventListener('click', (e) => {
    if (e.target === deleteModal) hideDeleteModal();
});

// Close modals on Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (!userModal.classList.contains('hidden')) hideModal();
        if (!deleteModal.classList.contains('hidden')) hideDeleteModal();
    }
});

// Initialize
document.addEventListener('DOMContentLoaded', loadUsers);
</script>
