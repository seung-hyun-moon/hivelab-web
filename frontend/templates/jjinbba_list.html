{% extends 'base.html' %}

{% block content %}
<div>
    <div class="mt-10">
        <table id="jjinbbaTable" class="hover compact stripe cell-border" style="width:100%">
            <colgroup>
                <col width="10%" /><!-- 담당자 -->
                <col width="30%" /><!-- 제목 -->
                <col width="10%" /><!-- 총개수 -->
                <col width="25%" /><!-- 행정동(개수) -->
                <col width="15%" /><!-- 수정날짜 -->
                <col width="5%" /><!-- 완료여부 -->
                <col width="5%" /><!-- 액션 -->
            </colgroup>
            <thead class="table-light">
                <tr>
                    <th>담당자</th>
                    <th>제목</th>
                    <th>총개수</th>
                    <th>행정동(개수)</th>
                    <th>수정날짜</th>
                    <th>완료여부</th>
                    <th>액션</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- 신규 등록 모달 -->
<div class="modal fade" id="addJjinbbaModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addModalLabel">새 매물그룹 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form onsubmit="return false;">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">담당자</label>
                        <input type="text" class="form-control" name="person" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" name="description" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">매물번호 (띄어쓰기로 구분)</label>
                        <textarea class="form-control" name="numbers" rows="3" placeholder="예: 2504165111 2504184501" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 수정 모달 -->
<div class="modal fade" id="editJjinbbaModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">매물그룹 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm">
                <input type="hidden" name="id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">담당자</label>
                        <input type="text" class="form-control" name="person" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" name="description" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">매물번호 (띄어쓰기로 구분)</label>
                        <textarea class="form-control" name="numbers" rows="5" placeholder="예: 2504165111 2504184501" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">수정</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', path='js/jjinbba_list.js') }}"></script>
{% endblock %}
