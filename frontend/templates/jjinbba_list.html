{% extends 'base.html' %}

{% block content %}
<div class="mx-auto px-4 py-6 mt-10">
    <!-- Datatable Wrapper -->
    <div class="overflow-x-auto animate-fade-in min-w-[768px]">
        <table id="jjinbbaTable" class="stripe hover cell-border w-full text-left text-gray-700 text-sm sm:text-base">
            <colgroup>
                <col width="5%" /> <!-- 담당자 -->
                <col width="5%" /> <!-- 고객정보 -->
                <col width="15%" /> <!-- 제목 -->
                <col width="6%" /> <!-- 총개수 -->
                <col width="17%" /> <!-- 행정동(개수) -->
                <col width="32%" /> <!-- 매물번호 -->
                <col width="10%" /> <!-- 수정날짜 -->
                <col width="5%" />  <!-- 완료여부 -->
                <col width="5%" />  <!-- 액션 -->
            </colgroup>
            <thead class="backdrop-blur-sm text-gray-900">
                <tr>
                    <th class="">담당자</th>
                    <th class="">고객정보</th>
                    <th class="">제목</th>
                    <th class="">총개수</th>
                    <th class="">행정동(개수)</th>
                    <th class="">매물번호</th>
                    <th class="">수정날짜</th>
                    <th class="">완료여부</th>
                    <th class="">액션</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            </tbody>
        </table>
    </div>
</div>

<!-- 신규 등록 모달 -->
<div class="modal fade" id="addJjinbbaModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addModalLabel">새 매물그룹 등록</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form onsubmit="return false;" class="grid-form">
          <fieldset class="border p-2 mb-3">
            <legend class="w-auto pb-3">매물그룹 정보</legend>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">담당자</label>
              </div>
              <div class="col-md-10">
                <select class="form-select" name="person" required>
                  <option value="">선택하세요</option>
                </select>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">고객정보</label>
              </div>
              <div class="col-md-10">
                <select class="form-select" name="customer">
                  <option value="">고객 번호를 입력해주세요.</option>
                  <!-- Dynamically populated customer options -->
                </select>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">제목</label>
              </div>
              <div class="col-md-10">
                <input type="text" class="form-control" name="description" required>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">매물번호 (띄어쓰기로 구분)</label>
              </div>
              <div class="col-md-10">
                <textarea class="form-control" name="numbers" rows="3" placeholder="예: 2504165111 2504184501" required></textarea>
              </div>
            </div>
          </fieldset>
          <div class="text-end pt-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 수정 모달 -->
<div class="modal fade" id="modifyJjinbbaModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">매물그룹 수정</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editForm" onsubmit="return false;" class="grid-form">
          <input type="hidden" name="id">
          <fieldset class="border p-2 mb-3">
            <legend class="w-auto pb-3">매물그룹 정보</legend>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">담당자</label>
              </div>
              <div class="col-md-10">
                <select class="form-select" name="person" required>
                  <option value="">선택하세요</option>
                </select>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">고객정보</label>
              </div>
              <div class="col-md-10">
                <select class="form-select" name="customer">
<!--                  <option value="">고객 번호를 입력해주세요.</option>-->
                  <!-- Dynamically populated customer options -->
                </select>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">제목</label>
              </div>
              <div class="col-md-10">
                <input type="text" class="form-control" name="description" required>
              </div>
            </div>
            <div class="row mb-3 align-items-center">
              <div class="col-md-2">
                <label class="form-label">매물번호 (띄어쓰기로 구분)</label>
              </div>
              <div class="col-md-10">
                <textarea class="form-control" name="numbers" rows="3" required></textarea>
              </div>
<!--              <div class="col-md-2">-->
<!--                <label class="form-label">추가 매물번호 (필터 규칙 적용)</label>-->
<!--              </div>-->
<!--              <div class="col-md-10">-->
<!--                <textarea class="form-control" name="additional_numbers" rows="3" placeholder="예: 2504165111 2504184501" required></textarea>-->
<!--              </div>-->
            </div>
          </fieldset>
          <div class="text-end pt-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            <button type="submit" class="btn btn-primary">수정</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>


<style>
    @keyframes fade-in {
        0%   {opacity:0;transform:translateY(10px)}
        100% {opacity:1;transform:translateY(0)}
    }
    .animate-fade-in {animation: fade-in 0.6s ease-out both;}

    table.dataTable tbody tr {
        transition: background-color .2s ease-in-out;
    }
    table.dataTable tbody tr:hover {
        background-color: #fffbe6;
    }

    .btn-outline-warning {
        background: transparent !important;
        transition: transform .3s ease, background-color .3s ease, color .3s ease;
    }
    .btn-outline-warning:hover {
        transform:scale(1.05);
    }
    .btn-outline-danger {
        background: transparent !important;
        transition: transform .3s ease, background-color .3s ease, color .3s ease;
    }
    .btn-outline-danger:hover {
        transform:scale(1.05);
    }

    @media(max-width:768px){
        div.dataTables_wrapper .dataTables_filter,
        div.dataTables_wrapper .dataTables_length{
            text-align:left;
            margin-bottom:1rem;
        }
    }
</style>

<script src="{{ url_for('static', path='js/jjinbba_list.js') }}"></script>
{% endblock %}
