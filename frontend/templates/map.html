<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매물 지도 뷰어</title>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=nmk2zi23oj"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif; background: #f4f5f7; color: #191f28; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100%; }

        .control-bar {
            background: #fff; padding: 10px 16px; border-bottom: 1px solid #e5e8eb;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 1000; flex-shrink: 0;
        }
        .control-group { display: flex; align-items: center; gap: 5px; }
        .control-group label { font-size: 12px; font-weight: 600; color: #4e5968; white-space: nowrap; }

        input[type="text"], input[type="number"], select, textarea {
            padding: 7px 10px; border: 1px solid #e5e8eb; border-radius: 6px; font-size: 12px;
            outline: none; transition: all 0.2s; background: #f9fafb;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: #1b64da; background: #fff; box-shadow: 0 0 0 3px rgba(27, 100, 218, 0.1);
        }
        input[type="color"] { width: 32px; height: 32px; border: 1px solid #e5e8eb; border-radius: 6px; cursor: pointer; padding: 2px; }
        input[type="range"] { width: 50px; cursor: pointer; height: 4px; -webkit-appearance: none; background: #e5e8eb; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #1b64da; border-radius: 50%; cursor: pointer; }

        button {
            padding: 7px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        .btn-primary { background: #1b64da; color: white; }
        .btn-primary:hover { background: #1557c0; }
        .btn-secondary { background: #f2f4f6; color: #4e5968; }
        .btn-secondary:hover { background: #e5e8eb; }
        .btn-danger { background: #f2f4f6; color: #e53935; }
        .btn-danger:hover { background: #ffebee; }
        .btn-tool { background: #f2f4f6; color: #4e5968; padding: 7px 10px; }
        .btn-tool:hover { background: #e5e8eb; }
        .btn-tool.active { background: #1b64da; color: white; }
        .btn-map { background: #10b981; color: white; }
        .btn-map:hover { background: #059669; }
        .btn-toggle { background: #10b981; color: white; }
        .btn-toggle.closed { background: #6b7280; }

        .main-content { flex: 1; display: flex; position: relative; overflow: hidden; min-height: 0; }
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        #drawing-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        #drawing-canvas.active { pointer-events: auto; cursor: crosshair; }
        #drawing-canvas.moving { pointer-events: auto; cursor: move; }

        .transport-panel {
            position: absolute; top: 16px; right: 16px; width: 380px; height: 200px;
            min-width: 220px; min-height: 100px; max-width: 95%; max-height: 80%;
            background: rgba(255, 255, 255, 0.95); border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12); z-index: 200; display: none;
            flex-direction: column; cursor: move; backdrop-filter: blur(12px); resize: both; overflow: hidden;
        }
        .transport-panel.visible { display: flex; }
        .transport-header { background: linear-gradient(135deg, #1b64da 0%, #3b82f6 100%); color: white; padding: 8px 12px; font-weight: 700; font-size: 12px; flex-shrink: 0; }
        .transport-content { flex: 1; padding: 10px; overflow: auto; transform-origin: top left; }
        .transport-section { margin-bottom: 10px; }
        .transport-section:last-child { margin-bottom: 0; }
        .section-title { font-size: 10px; font-weight: 700; color: #6b7684; margin-bottom: 6px; }

        .subway-row, .bus-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

        .subway-pill {
            display: inline-flex; align-items: center; padding: 0; border-radius: 14px;
            font-size: 11px; font-weight: 700; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); overflow: hidden;
        }
        .subway-pill .station-info { display: flex; align-items: center; gap: 4px; padding: 5px 8px; }
        .subway-pill .station-name { font-weight: 800; }
        .subway-pill .line-badge { background: rgba(255,255,255,0.25); padding: 2px 5px; border-radius: 6px; font-size: 9px; }
        .subway-pill .walk-info { background: rgba(0,0,0,0.2); padding: 5px 8px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
        .subway-pill .walk-info .time { color: #fff; }
        .subway-pill .walk-info .dist { color: rgba(255,255,255,0.85); font-size: 9px; }

        .bus-pill {
            display: inline-flex; align-items: center; padding: 0; border-radius: 14px;
            font-size: 11px; font-weight: 700; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); overflow: hidden;
        }
        .bus-pill .bus-info { display: flex; align-items: center; gap: 4px; padding: 5px 8px; }
        .bus-pill .bus-type-name { font-weight: 800; }
        .bus-pill .bus-numbers { display: flex; gap: 2px; }
        .bus-pill .bus-num { background: rgba(255,255,255,0.25); padding: 2px 4px; border-radius: 4px; font-size: 9px; }
        .bus-pill .walk-info { background: rgba(0,0,0,0.2); padding: 5px 8px; font-size: 10px; font-weight: 700; }

        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loading-overlay.visible { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e5e8eb; border-top: 3px solid #1b64da; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); text-align: center; z-index: 500; display: none; max-width: 300px; }
        .error-message.visible { display: block; }
        .error-message h3 { color: #e53935; margin-bottom: 10px; font-size: 16px; }
        .error-message p { color: #4e5968; font-size: 13px; line-height: 1.5; }

        .initial-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 300; }
        .initial-screen.hidden { display: none; }
        .initial-box { text-align: center; max-width: 340px; width: 90%; padding: 20px; }
        .initial-box .icon { width: 64px; height: 64px; background: #f2f4f6; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px; }
        .initial-box h1 { color: #191f28; margin-bottom: 6px; font-size: 22px; font-weight: 700; }
        .initial-box p { color: #8b95a1; margin-bottom: 28px; font-size: 14px; line-height: 1.5; }
        .initial-box input { width: 100%; padding: 14px; font-size: 15px; margin-bottom: 10px; text-align: center; }
        .initial-box button { width: 100%; padding: 14px; font-size: 15px; justify-content: center; }

        .divider { width: 1px; height: 26px; background: #e5e8eb; margin: 0 2px; }

        .text-input-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .text-input-modal.visible { display: flex; }
        .text-input-box { background: white; padding: 24px; border-radius: 14px; min-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.16); }
        .text-input-box h3 { margin-bottom: 16px; font-size: 16px; font-weight: 700; color: #191f28; }
        .text-input-box textarea { width: 100%; height: 100px; margin-bottom: 16px; resize: vertical; font-family: inherit; }
        .text-input-box .btn-group { display: flex; gap: 8px; justify-content: flex-end; }

        #capture-area { position: relative; width: 100%; height: 100%; }
        .slider-value { font-size: 10px; color: #6b7684; min-width: 28px; text-align: center; }
        .control-box { background: #f8f9fa; border: 1px solid #e5e8eb; border-radius: 6px; padding: 5px 8px; display: flex; align-items: center; gap: 6px; }
        .control-box-title { font-size: 10px; font-weight: 700; color: #1b64da; }
        .rect-options { display: flex; align-items: center; gap: 6px; }
        .rect-options.hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="control-bar">
            <div class="control-group">
                <label>매물번호</label>
                <input type="text" id="property-id-input" placeholder="매물번호" style="width: 100px;">
                <button class="btn-primary" onclick="loadProperty()">조회</button>
            </div>
            <div class="divider"></div>
            <button class="btn-map" id="btn-map-mode" onclick="setMapMode()">🗺️ 지도</button>
            <div class="control-group">
                <button class="btn-tool" id="btn-move" onclick="setTool('move')">✋ 이동</button>
                <button class="btn-tool" id="btn-line" onclick="setTool('line')">📏 선</button>
                <button class="btn-tool" id="btn-arrow" onclick="setTool('arrow')">➡️ 화살표</button>
                <button class="btn-tool" id="btn-circle" onclick="setTool('circle')">⭕ 원</button>
                <button class="btn-tool" id="btn-rect" onclick="setTool('rect')">⬜ 사각형</button>
                <button class="btn-tool" id="btn-text" onclick="setTool('text')">✏️ 텍스트</button>
                <button class="btn-tool" id="btn-eraser" onclick="setTool('eraser')">🧹 지우기</button>
            </div>
            <div class="divider"></div>
            <div class="control-group">
                <label>선</label>
                <input type="color" id="draw-color" value="#ff0000">
                <input type="number" id="draw-width" value="3" min="1" max="20" style="width: 48px;">
            </div>
            <div class="rect-options hidden" id="rect-options">
                <label>배경</label>
                <input type="color" id="fill-color" value="#ffffff">
                <label>투명</label>
                <input type="range" id="fill-opacity" min="0" max="100" value="80" style="width: 40px;">
                <span class="slider-value" id="fill-opacity-value">80%</span>
            </div>
            <div class="control-group">
                <label>글꼴</label>
                <select id="font-family" style="width: 80px;">
                    <option value="Malgun Gothic">맑은고딕</option>
                    <option value="Arial">Arial</option>
                </select>
                <input type="number" id="font-size" value="16" min="10" max="72" style="width: 48px;">
                <label>굵게</label>
                <input type="checkbox" id="font-bold" checked style="width: 16px; height: 16px; cursor: pointer;">
            </div>
            <div class="divider"></div>
            <button class="btn-danger" onclick="clearDrawings()">전체삭제</button>
            <button class="btn-primary" onclick="captureScreen()">📷 캡처</button>
            <div class="divider"></div>
            <div class="control-box">
                <span class="control-box-title">🚇교통</span>
                <button class="btn-toggle" id="btn-transport-toggle" onclick="toggleTransportPanel()" style="padding: 5px 8px; font-size: 11px;">닫기</button>
                <label>투명</label>
                <input type="range" id="transport-opacity" min="20" max="100" value="95" oninput="changeTransportOpacity(this.value)">
                <span class="slider-value" id="opacity-value">95%</span>
                <label>크기</label>
                <input type="range" id="transport-scale" min="50" max="150" value="100" oninput="changeTransportScale(this.value)">
                <span class="slider-value" id="scale-value">100%</span>
            </div>
        </div>

        <div class="main-content">
            <div id="capture-area">
                <div id="map-container">
                    <div id="map"></div>
                    <canvas id="drawing-canvas"></canvas>
                </div>
                <div class="transport-panel visible" id="transport-panel">
                    <div class="transport-header">🚇 교통 정보</div>
                    <div class="transport-content" id="transport-content"></div>
                </div>
            </div>
            <div class="initial-screen" id="initial-screen">
                <div class="initial-box">
                    <div class="icon">🏠</div>
                    <h1>매물 지도 뷰어</h1>
                    <p>매물번호를 입력하면<br>위치와 교통정보를 확인할 수 있어요</p>
                    <input type="text" id="initial-property-id" placeholder="매물번호 입력">
                    <button class="btn-primary" onclick="loadPropertyFromInitial()">조회하기</button>
                </div>
            </div>
            <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
            <div class="error-message" id="error-message">
                <h3>오류 발생</h3>
                <p id="error-text"></p>
                <button class="btn-primary" onclick="hideError()" style="margin-top: 16px; width: 100%; justify-content: center;">확인</button>
            </div>
        </div>
    </div>

    <div class="text-input-modal" id="text-modal">
        <div class="text-input-box">
            <h3>텍스트 입력 (여러 줄 가능)</h3>
            <textarea id="text-input" placeholder="텍스트를 입력하세요&#10;Ctrl+Enter로 확인"></textarea>
            <div class="btn-group">
                <button class="btn-secondary" onclick="cancelTextInput()">취소</button>
                <button class="btn-primary" onclick="confirmTextInput()">확인</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = '';
        let map = null, marker = null, currentTool = null, isDrawing = false, startPos = null;
        let drawings = [], textPosition = null, transportData = null;
        let transportOpacity = 0.95, transportScale = 1.0, isPanelOpen = true;
        let canvas = null, ctx = null;
        let selectedIndex = -1, isDraggingShape = false, dragOffset = { x: 0, y: 0 };

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('drawing-canvas');
            ctx = canvas.getContext('2d');
            document.getElementById('fill-opacity').addEventListener('input', (e) => {
                document.getElementById('fill-opacity-value').textContent = e.target.value + '%';
            });
            const urlParams = new URLSearchParams(window.location.search);
            const propertyId = urlParams.get('id') || urlParams.get('매물번호');
            if (propertyId) { document.getElementById('property-id-input').value = propertyId; loadProperty(); }
            document.getElementById('property-id-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') loadProperty(); });
            document.getElementById('initial-property-id').addEventListener('keypress', (e) => { if (e.key === 'Enter') loadPropertyFromInitial(); });
            document.getElementById('text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) confirmTextInput(); });
            setupCanvasEvents();
            setupDraggable();
            updateTransportPanel();
        });

        function changeTransportOpacity(value) {
            transportOpacity = value / 100;
            document.getElementById('opacity-value').textContent = value + '%';
            updateTransportPanel();
        }

        function changeTransportScale(value) {
            transportScale = value / 100;
            document.getElementById('scale-value').textContent = value + '%';
            updateTransportPanel();
        }

        function updateTransportPanel() {
            const panel = document.getElementById('transport-panel');
            panel.style.opacity = transportOpacity;
            const content = document.getElementById('transport-content');
            content.style.transform = `scale(${transportScale})`;
            content.style.transformOrigin = 'top left';
            content.style.width = `${100 / transportScale}%`;
        }

        function toggleTransportPanel() {
            const panel = document.getElementById('transport-panel');
            const btn = document.getElementById('btn-transport-toggle');
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) { panel.classList.add('visible'); btn.textContent = '닫기'; btn.classList.remove('closed'); }
            else { panel.classList.remove('visible'); btn.textContent = '열기'; btn.classList.add('closed'); }
        }

        function showTransportPanel() {
            const panel = document.getElementById('transport-panel');
            const btn = document.getElementById('btn-transport-toggle');
            panel.classList.add('visible'); isPanelOpen = true; btn.textContent = '닫기'; btn.classList.remove('closed');
        }

        function initMap(lat, lng) {
            const mapContainer = document.getElementById('map');
            map = new naver.maps.Map(mapContainer, {
                center: new naver.maps.LatLng(lat, lng), zoom: 17, scrollWheel: true, zoomControl: true,
                zoomControlOptions: { position: naver.maps.Position.TOP_LEFT }
            });
            marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(lat, lng),
                map: map,
                icon: {
                    content: `
                    <div style="width:40px; height:56px; position:relative;">
                        <div style="
                            width:40px; height:40px;
                            background:#fff; border-radius:50% 50% 50% 0;
                            transform:rotate(-45deg);
                            position:absolute; top:0; left:0;
                            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
                        "></div>

                        <div style="
                            width:20px; height:20px;
                            position:absolute; top:10px; left:10px;
                            background:transparent;
                        ">
                            <div style="position:absolute; left:0; top:0; width:100%; height:35%; background:#F7CB14;"></div>
                            <div style="position:absolute; right:0; top:0; width:35%; height:100%; background:#F7CB14;"></div>
                            <div style="position:absolute; left:0; bottom:0; width:55%; height:55%;">
                                <div style="position:absolute; left:0; top:0; width:45%; height:100%; background:#9E9E9E;"></div>
                                <div style="position:absolute; left:0; bottom:0; width:100%; height:45%; background:#9E9E9E;"></div>
                            </div>
                        </div>
                    </div>`,
                    // 40px의 중앙인 20, 물방울의 실제 뾰족한 끝점인 약 54~56 정도로 조절
                    anchor: new naver.maps.Point(20, 54)
                }
            });

            resizeCanvas();
            naver.maps.Event.addListener(map, 'resize', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            redrawCanvas();
        }

        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
        }

        function handleMouseDown(e) {
            if (!currentTool) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;

            if (currentTool === 'move') {
                selectedIndex = findShapeAt(x, y);
                if (selectedIndex >= 0) {
                    isDraggingShape = true;
                    const d = drawings[selectedIndex];
                    if (d.type === 'text') dragOffset = { x: x - d.x, y: y - d.y };
                    else if (d.type === 'circle') dragOffset = { x: x - d.centerX, y: y - d.centerY };
                    else if (d.type === 'rect') dragOffset = { x: x - d.x, y: y - d.y };
                    else dragOffset = { x: x - d.startX, y: y - d.startY };
                    redrawCanvas();
                }
                return;
            }
            if (currentTool === 'eraser') { eraseAtPosition(x, y); return; }
            if (currentTool === 'text') {
                textPosition = { x, y };
                document.getElementById('text-modal').classList.add('visible');
                setTimeout(() => document.getElementById('text-input').focus(), 100);
                return;
            }
            isDrawing = true;
            startPos = { x, y };
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;

            if (currentTool === 'move' && isDraggingShape && selectedIndex >= 0) {
                const d = drawings[selectedIndex];
                if (d.type === 'text') { d.x = x - dragOffset.x; d.y = y - dragOffset.y; }
                else if (d.type === 'circle') { d.centerX = x - dragOffset.x; d.centerY = y - dragOffset.y; }
                else if (d.type === 'rect') { d.x = x - dragOffset.x; d.y = y - dragOffset.y; }
                else {
                    const dx = x - dragOffset.x - d.startX, dy = y - dragOffset.y - d.startY;
                    d.startX += dx; d.startY += dy; d.endX += dx; d.endY += dy;
                    dragOffset = { x: x - d.startX, y: y - d.startY };
                }
                redrawCanvas();
                return;
            }

            if (!isDrawing || !currentTool || ['text', 'eraser', 'move'].includes(currentTool)) return;
            redrawCanvas();
            const color = document.getElementById('draw-color').value;
            const width = parseInt(document.getElementById('draw-width').value);
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';

            if (currentTool === 'line') { ctx.beginPath(); ctx.moveTo(startPos.x, startPos.y); ctx.lineTo(x, y); ctx.stroke(); }
            else if (currentTool === 'arrow') drawArrow(ctx, startPos.x, startPos.y, x, y, color, width);
            else if (currentTool === 'circle') { const r = Math.sqrt((x-startPos.x)**2 + (y-startPos.y)**2); ctx.beginPath(); ctx.arc(startPos.x, startPos.y, r, 0, Math.PI*2); ctx.stroke(); }
            else if (currentTool === 'rect') drawRectPreview(startPos.x, startPos.y, x, y);
        }

        function handleMouseUp(e) {
            if (currentTool === 'move') { isDraggingShape = false; return; }
            if (!isDrawing || !currentTool || ['text', 'eraser', 'move'].includes(currentTool)) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const color = document.getElementById('draw-color').value;
            const width = parseInt(document.getElementById('draw-width').value);

            if (currentTool === 'line') drawings.push({ type: 'line', startX: startPos.x, startY: startPos.y, endX: x, endY: y, color, width });
            else if (currentTool === 'arrow') drawings.push({ type: 'arrow', startX: startPos.x, startY: startPos.y, endX: x, endY: y, color, width });
            else if (currentTool === 'circle') { const r = Math.sqrt((x-startPos.x)**2 + (y-startPos.y)**2); drawings.push({ type: 'circle', centerX: startPos.x, centerY: startPos.y, radius: r, color, width }); }
            else if (currentTool === 'rect') {
                const fillColor = document.getElementById('fill-color').value;
                const fillOpacity = parseInt(document.getElementById('fill-opacity').value) / 100;
                drawings.push({ type: 'rect', x: Math.min(startPos.x, x), y: Math.min(startPos.y, y), w: Math.abs(x-startPos.x), h: Math.abs(y-startPos.y), color, width, fillColor, fillOpacity });
            }
            isDrawing = false; startPos = null; redrawCanvas();
        }

        function findShapeAt(x, y) {
            for (let i = drawings.length - 1; i >= 0; i--) {
                const d = drawings[i];
                if (d.type === 'text') {
                    ctx.font = `${d.fontBold ? 'bold' : 'normal'} ${d.fontSize}px ${d.fontFamily}`;
                    const lines = d.text.split('\n'), lh = d.fontSize * 1.2;
                    const mw = Math.max(...lines.map(l => ctx.measureText(l).width));
                    if (x >= d.x && x <= d.x + mw && y >= d.y - d.fontSize && y <= d.y - d.fontSize + lines.length * lh) return i;
                } else if (d.type === 'circle') {
                    if (Math.sqrt((x-d.centerX)**2 + (y-d.centerY)**2) <= d.radius + 10) return i;
                } else if (d.type === 'rect') {
                    if (x >= d.x - 5 && x <= d.x + d.w + 5 && y >= d.y - 5 && y <= d.y + d.h + 5) return i;
                } else if (pointToLineDistance(x, y, d.startX, d.startY, d.endX, d.endY) < 15) return i;
            }
            return -1;
        }

        function drawRectPreview(x1, y1, x2, y2) {
            const fc = document.getElementById('fill-color').value;
            const fo = parseInt(document.getElementById('fill-opacity').value) / 100;
            const c = document.getElementById('draw-color').value;
            const w = parseInt(document.getElementById('draw-width').value);
            const rx = Math.min(x1, x2), ry = Math.min(y1, y2), rw = Math.abs(x2-x1), rh = Math.abs(y2-y1);
            ctx.fillStyle = hexToRgba(fc, fo); ctx.fillRect(rx, ry, rw, rh);
            ctx.strokeStyle = c; ctx.lineWidth = w; ctx.strokeRect(rx, ry, rw, rh);
        }

        function hexToRgba(hex, a) { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

        function drawArrow(ctx, fx, fy, tx, ty, c, w) {
            const hl = Math.max(w * 4, 15), a = Math.atan2(ty - fy, tx - fx);
            ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(tx, ty);
            ctx.lineTo(tx - hl * Math.cos(a - Math.PI/6), ty - hl * Math.sin(a - Math.PI/6));
            ctx.lineTo(tx - hl * Math.cos(a + Math.PI/6), ty - hl * Math.sin(a + Math.PI/6));
            ctx.closePath(); ctx.fill();
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawings.forEach((d, idx) => {
                ctx.strokeStyle = d.color; ctx.fillStyle = d.color; ctx.lineWidth = d.width || 3; ctx.lineCap = 'round';
                if (d.type === 'line') { ctx.beginPath(); ctx.moveTo(d.startX, d.startY); ctx.lineTo(d.endX, d.endY); ctx.stroke(); }
                else if (d.type === 'arrow') drawArrow(ctx, d.startX, d.startY, d.endX, d.endY, d.color, d.width);
                else if (d.type === 'circle') { ctx.beginPath(); ctx.arc(d.centerX, d.centerY, d.radius, 0, Math.PI*2); ctx.stroke(); }
                else if (d.type === 'rect') { ctx.fillStyle = hexToRgba(d.fillColor, d.fillOpacity); ctx.fillRect(d.x, d.y, d.w, d.h); ctx.strokeStyle = d.color; ctx.lineWidth = d.width; ctx.strokeRect(d.x, d.y, d.w, d.h); }
                else if (d.type === 'text') { ctx.font = `${d.fontBold ? 'bold' : 'normal'} ${d.fontSize}px ${d.fontFamily}`; ctx.fillStyle = d.color; d.text.split('\n').forEach((l, i) => ctx.fillText(l, d.x, d.y + i * d.fontSize * 1.2)); }
                if (currentTool === 'move' && idx === selectedIndex) {
                    ctx.strokeStyle = '#1b64da'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
                    if (d.type === 'circle') ctx.strokeRect(d.centerX - d.radius - 5, d.centerY - d.radius - 5, d.radius*2 + 10, d.radius*2 + 10);
                    else if (d.type === 'rect') ctx.strokeRect(d.x - 5, d.y - 5, d.w + 10, d.h + 10);
                    else if (d.type === 'text') { const lines = d.text.split('\n'), lh = d.fontSize * 1.2, mw = Math.max(...lines.map(l => ctx.measureText(l).width)); ctx.strokeRect(d.x - 5, d.y - d.fontSize - 5, mw + 10, lines.length * lh + 10); }
                    else ctx.strokeRect(Math.min(d.startX, d.endX) - 5, Math.min(d.startY, d.endY) - 5, Math.abs(d.endX - d.startX) + 10, Math.abs(d.endY - d.startY) + 10);
                    ctx.setLineDash([]);
                }
            });
        }

        function setMapMode() { currentTool = null; selectedIndex = -1; document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active')); canvas.classList.remove('active', 'moving'); document.getElementById('rect-options').classList.add('hidden'); redrawCanvas(); }

        function setTool(tool) {
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            selectedIndex = -1;
            if (currentTool === tool) { currentTool = null; canvas.classList.remove('active', 'moving'); }
            else { currentTool = tool; canvas.classList.add(tool === 'move' ? 'moving' : 'active'); canvas.classList.remove(tool === 'move' ? 'active' : 'moving'); document.getElementById(`btn-${tool}`).classList.add('active'); }
            document.getElementById('rect-options').classList.toggle('hidden', tool !== 'rect');
            redrawCanvas();
        }

        function confirmTextInput() {
            const text = document.getElementById('text-input').value.trim();
            if (text && textPosition) {
                drawings.push({ type: 'text', text, x: textPosition.x, y: textPosition.y, color: document.getElementById('draw-color').value, fontFamily: document.getElementById('font-family').value, fontSize: parseInt(document.getElementById('font-size').value), fontBold: document.getElementById('font-bold').checked });
                redrawCanvas();
            }
            cancelTextInput();
        }

        function cancelTextInput() { document.getElementById('text-modal').classList.remove('visible'); document.getElementById('text-input').value = ''; textPosition = null; }

        function eraseAtPosition(x, y) { const idx = findShapeAt(x, y); if (idx >= 0) { drawings.splice(idx, 1); redrawCanvas(); } }

        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            const dot = A*C + B*D, lenSq = C*C + D*D;
            let param = lenSq ? dot / lenSq : -1, xx, yy;
            if (param < 0) { xx = x1; yy = y1; } else if (param > 1) { xx = x2; yy = y2; } else { xx = x1 + param*C; yy = y1 + param*D; }
            return Math.sqrt((px-xx)**2 + (py-yy)**2);
        }

        function clearDrawings() { drawings = []; redrawCanvas(); }

        async function loadProperty() {
            const propertyId = document.getElementById('property-id-input').value.trim();
            if (!propertyId) { showError('매물번호를 입력해주세요.'); return; }
            showLoading(); hideInitialScreen();
            try {
                const res = await fetch(`${BASE_URL}/api/jjinbba/single/${propertyId}`);
                if (!res.ok) throw new Error('매물 정보를 가져올 수 없습니다.');
                const data = await res.json();
                const lat = parseFloat(data.latitude), lng = parseFloat(data.longitude);
                if (!lat || !lng) throw new Error('위치 정보가 없습니다.');
                try {
                    const tRes = await fetch(`${BASE_URL}/api/jjinbba/transport/${propertyId}`);
                    if (tRes.ok) { const tData = await tRes.json(); if (tData.isSuccess && tData.result) { transportData = tData.result; renderTransportInfo(transportData); showTransportPanel(); } }
                } catch (e) { console.log('교통 정보 조회 실패:', e); }
                initMap(lat, lng);
                window.history.pushState({ propertyId }, '', `${window.location.pathname}?id=${propertyId}`);
            } catch (e) { showError(e.message); } finally { hideLoading(); }
        }

        function loadPropertyFromInitial() { document.getElementById('property-id-input').value = document.getElementById('initial-property-id').value.trim(); loadProperty(); }

        function renderTransportInfo(data) {
            const content = document.getElementById('transport-content');
            let html = '';
            if (data.subwayList?.length) {
                html += '<div class="transport-section"><div class="section-title">🚇 지하철</div><div class="subway-row">';
                data.subwayList.forEach(s => s.typeList.forEach(l => {
                    const dist = l.distance || (l.walkingDuration ? Math.round(l.walkingDuration * 67) : '');
                    html += `<span class="subway-pill" style="background:${l.color}"><span class="station-info"><span class="station-name">${s.stationName}</span><span class="line-badge">${l.name}</span></span><span class="walk-info"><span class="time">${l.walkingDuration}분</span>${dist ? `<span class="dist">${dist}m</span>` : ''}</span></span>`;
                }));
                html += '</div></div>';
            }
            if (data.busList?.length) {
                html += '<div class="transport-section"><div class="section-title">🚌 버스</div><div class="bus-row">';
                data.busList.forEach(b => {
                    const dist = b.distance || (b.walkingDuration ? Math.round(b.walkingDuration * 67) : '');
                    html += `<span class="bus-pill" style="background:${b.typeColor}"><span class="bus-info"><span class="bus-type-name">${b.typeName}</span><span class="bus-numbers">`;
                    b.list.forEach(n => {
                        html += `<span class="bus-num">${n}</span>`;
                    });
                    html += '</span></span>';
                    if (b.walkingDuration || dist) html += `<span class="walk-info">${b.walkingDuration ? b.walkingDuration + '분' : ''}${dist ? ' ' + dist + 'm' : ''}</span>`;
                    html += '</span>';
                });
                html += '</div></div>';
            }
            content.innerHTML = html;
            updateTransportPanel();
        }

        function setupDraggable() {
            const panel = document.getElementById('transport-panel'), header = panel.querySelector('.transport-header');
            let isDragging = false, currentX, currentY, initialX, initialY;
            header.addEventListener('mousedown', e => { isDragging = true; initialX = e.clientX - panel.offsetLeft; initialY = e.clientY - panel.offsetTop; e.preventDefault(); });
            document.addEventListener('mousemove', e => {
                if (!isDragging) return; e.preventDefault();
                currentX = e.clientX - initialX; currentY = e.clientY - initialY;
                const container = document.querySelector('.main-content');
                currentX = Math.max(0, Math.min(currentX, container.offsetWidth - panel.offsetWidth));
                currentY = Math.max(0, Math.min(currentY, container.offsetHeight - panel.offsetHeight));
                panel.style.left = currentX + 'px'; panel.style.top = currentY + 'px'; panel.style.right = 'auto';
            });
            document.addEventListener('mouseup', () => isDragging = false);
        }

        async function captureScreen() {
            showLoading();
            try {
                const captureCanvas = await html2canvas(document.getElementById('capture-area'), { useCORS: true, allowTaint: true, backgroundColor: '#fff', scale: 2 });
                const link = document.createElement('a');
                link.download = `property_${document.getElementById('property-id-input').value || 'map'}_${new Date().toISOString().slice(0, 19).replace(/[:-]/g, '')}.png`;
                link.href = captureCanvas.toDataURL('image/png'); link.click();
            } catch (e) { showError('캡처 중 오류: ' + e.message); } finally { hideLoading(); }
        }

        function showLoading() { document.getElementById('loading-overlay').classList.add('visible'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.remove('visible'); }
        function showError(msg) { document.getElementById('error-text').textContent = msg; document.getElementById('error-message').classList.add('visible'); }
        function hideError() { document.getElementById('error-message').classList.remove('visible'); }
        function hideInitialScreen() { document.getElementById('initial-screen').classList.add('hidden'); }
    </script>
</body>
